[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "presence-checker"
version = "0.1.0"
description = "KSE student presence checker with rotating QR and Google Sheets"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.2",
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
    "gspread>=6.1",
    "qrcode[pil]>=7.4",
    "pyngrok>=7.2",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["ruff"]

[tool.ruff]
line-length = 100
