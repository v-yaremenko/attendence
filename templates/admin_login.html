<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presence Checker — Admin Login</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="card">
    <h1>Presence Checker</h1>
    <h2>Teacher Login</h2>
    <form method="post" action="/admin/login">
      <div class="form-group">
        <label for="key">Admin Key</label>
        <input type="password" id="key" name="key" placeholder="Enter your admin key" autofocus>
        <button type="submit" class="btn">Sign In</button>
      </div>
    </form>
  </div>
</body>
</html>
